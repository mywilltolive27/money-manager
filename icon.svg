<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26332F"/>
      <stop offset="1" stop-color="#161F1D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7C079"/>
      <stop offset="0.55" stop-color="#C08E3F"/>
      <stop offset="1" stop-color="#9C6D28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#3A4A44"/>
      <stop offset="1" stop-color="#161F1D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- coin ring -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.5"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.35" stroke-dasharray="2 9"/>

  <!-- A monogram -->
  <text x="256" y="264" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-weight="600"
        font-size="244" fill="url(#gold)">A</text>

  <!-- rupee accent: a second fine crossbar echoing the A's own -->
  <rect x="182" y="214" width="148" height="12" rx="6" fill="url(#gold)"/>
</svg>
